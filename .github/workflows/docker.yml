name: Build garmin-mcp image

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/garmin-mcp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/garmin-mcp:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger_redeploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via n8n
        run: curl -fsS -H "Content-Type: application/json" "https://n8n.gcourtot.fr/webhook/${{ secrets.N8N_WEBHOOK_ID }}"
